name: library-lending

services:
  db:
    image: postgres:16
    container_name: library-lending-db
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    ports:
      - "5432:5432"
    volumes:
      - library_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    shm_size: 128mb

volumes:
  library_pgdata:
